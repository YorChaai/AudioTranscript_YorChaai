name: audio_convert_app
description: Audio Convert to Text - Transcribe, Edit, PDF
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- Network & Data ---
  # Untuk komunikasi dengan Flask Server (upload/download/transcribe)
  http: ^1.2.0
  http_parser: ^4.0.0
  
  # --- File Operations ---
  # Untuk pilih file audio dari device
  file_picker: ^11.0.2
  # Untuk akses folder penyimpanan (download hasil)
  path_provider: ^2.1.0
  # Untuk buka file hasil (PDF/TXT) langsung dari app
  open_file: ^4.0.0
  
  # --- State Management & Storage ---
  # Untuk manajemen data antar screen (misal status koneksi)
  provider: ^6.1.0
  # Untuk penyimpanan pengaturan lokal (Tema & Bahasa)
  shared_preferences: ^2.2.3
  
  # --- UI (Tampilan) ---
  # Icon set standar iOS
  cupertino_icons: ^1.0.8
  # Font custom (kita pakai Google Fonts Inter)
  google_fonts: ^8.1.0
  # Efek loading yang keren (tulang-tulang loading)
  shimmer: ^3.0.0
  
  # --- Permissions ---
  # Untuk minta izin akses file di Android 13+
  permission_handler: ^12.0.3
  go_router: ^17.3.0
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  windows:
    generate: true
    image_path: "assets/logoapp.png"
    icon_size: 256
  image_path: "assets/logoapp.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
